name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/.scratch
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch test-results
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen
      - name: Generate official scoring fixtures
        run: uv run --frozen tests/native_fixtures.py
      - name: Check JavaScript and scoring rules
        run: |
          find public scripts tests -name '*.js' -o -name '*.mjs' | while read -r file; do node --check "$file"; done
          bash -n scripts/build-android.sh
          node scripts/check-metadata.mjs
          npm test
      - name: Install WebView test harness
        run: npx playwright install --with-deps chromium
      - name: Exercise bundled Android UI
        run: |
          node scripts/serve.mjs > .scratch/ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-evidence
          path: test-results/ui-smoke-*.png
          if-no-files-found: ignore

  debug:
    if: github.ref_type != 'tag'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Read app version
        id: version
        run: node --input-type=module -e 'import fs from "node:fs"; const xml=fs.readFileSync("android/AndroidManifest.xml","utf8"); fs.appendFileSync(process.env.GITHUB_OUTPUT,"name="+xml.match(/android:versionName="([^"]+)"/)[1]+"\n");'
      - name: Build debug APK
        run: ARC_DEBUG=1 scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arc-quest-${{ steps.version.outputs.name }}-debug
          path: android/build/arc-quest.apk
          if-no-files-found: error

  runtime:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: mkdir -p .scratch
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.2'
          python-version: '3.13.2'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install runtime compiler prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool pkg-config cmake ccache zip wget texinfo
      - name: Build runtime from pinned sources
        run: bash scripts/build-runtime.sh
      - name: Verify bundled runtime matches the source build
        run: git diff --exit-code -- public/runtime public/engine.zip public/licenses
      - name: Build unsigned APK
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: arc-quest-runtime-source
          path: |
            public/runtime
            public/engine.zip
      - uses: actions/upload-artifact@v7
        with:
          name: arc-quest-source-unsigned
          path: android/build/arc-quest-unsigned.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [checks, runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/download-artifact@v8
        with:
          name: arc-quest-source-unsigned
          path: android/build
      - name: Check release tag and metadata
        run: node scripts/check-metadata.mjs "$GITHUB_REF_NAME"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::KEYSTORE_BASE64 is not set. Configure the Eve signing secrets before tagging.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .scratch/eve-release.keystore
      - name: Build signed release
        env:
          ARC_RELEASE: '1'
          KEYSTORE_FILE: ${{ github.workspace }}/.scratch/eve-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --alignment-preserved true --ks "$KEYSTORE_FILE" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --ks-key-alias "$KEY_ALIAS" --out android/build/arc-quest.apk android/build/arc-quest-unsigned.apk
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/build/arc-quest.apk)
          if ! echo "$certificate" | grep -q 'SHA-256 digest: 2fe09f50180d92e3b3204992ffc9a8c598087b9a7bac0b12d3f23a1e3687fd7f'; then
            echo '::error::Release APK does not use the shared Eve signing certificate.' >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/build/arc-quest.apk "arc-quest-$TAG.apk"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "arc-quest-$TAG.apk" --title "ARC Quest $TAG" --generate-notes "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: arc-quest-${{ github.ref_name }}
          path: android/build/arc-quest.apk
          if-no-files-found: error
      - name: Remove decoded signing key
        if: always()
        run: rm -f .scratch/eve-release.keystore
