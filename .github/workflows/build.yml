name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TMPDIR: ${{ github.workspace }}/.scratch
  UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
  MPLCONFIGDIR: ${{ github.workspace }}/.cache/matplotlib

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch test-results
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.13'
      - run: npm ci
      - run: uv sync --frozen
      - name: Generate official scoring fixtures
        run: uv run --frozen tests/native_fixtures.py
      - name: Check JavaScript and scoring rules
        run: |
          find public scripts tests -name '*.js' -o -name '*.mjs' | while read -r file; do node --check "$file"; done
          bash -n scripts/build-android.sh
          npm test
      - name: Install WebView test harness
        run: npx playwright install --with-deps chromium
      - name: Exercise bundled Android UI
        run: |
          node scripts/serve.mjs > .scratch/ui-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          export CHROMIUM_PATH="$(node --input-type=module -e 'import {chromium} from "@playwright/test"; console.log(chromium.executablePath())')"
          node tests/ui-smoke.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: check-evidence
          path: test-results/ui-smoke-*.png
          if-no-files-found: ignore

  debug:
    if: github.ref_type != 'tag'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: ARC_DEBUG=1 scripts/build-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: arc-quest-debug
          path: android/build/arc-quest.apk
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - run: mkdir -p .scratch
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::KEYSTORE_BASE64 is not set. Configure the Eve signing secrets before tagging.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .scratch/eve-release.keystore
      - name: Build signed release
        env:
          ARC_RELEASE: '1'
          KEYSTORE_FILE: ${{ github.workspace }}/.scratch/eve-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          scripts/build-android.sh
          certificate=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/build/arc-quest.apk)
          if ! echo "$certificate" | grep -q 'SHA-256 digest: 2fe09f50180d92e3b3204992ffc9a8c598087b9a7bac0b12d3f23a1e3687fd7f'; then
            echo '::error::Release APK does not use the shared Eve signing certificate.' >&2
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp android/build/arc-quest.apk "arc-quest-$TAG.apk"
          flags=()
          case "$TAG" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" "arc-quest-$TAG.apk" --title "ARC Quest $TAG" --generate-notes "${flags[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: arc-quest-${{ github.ref_name }}
          path: android/build/arc-quest.apk
          if-no-files-found: error
      - name: Remove decoded signing key
        if: always()
        run: rm -f .scratch/eve-release.keystore
